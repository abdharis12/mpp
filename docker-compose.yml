services:

  # ==========================================================
  # Laravel + FrankenPHP
  # ==========================================================
  app:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: laravel_app_mpp

    restart: unless-stopped

    working_dir: /app

    volumes:
      - .:/app

    ports:
      - "8000:80"

    command: sh -c "php artisan migrate --force && php artisan wayfinder:generate --with-form --no-interaction && php artisan octane:frankenphp --host=0.0.0.0 --port=80"

    environment:
      APP_ENV: local
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: "3306"
      DB_DATABASE: ${DB_DATABASE:-laravel}
      DB_USERNAME: ${DB_USERNAME:-laravel}
      DB_PASSWORD: ${DB_PASSWORD:-secret}
      REDIS_HOST: redis
      REDIS_PORT: "6379"

    depends_on:
      mysql:
        condition: service_healthy

      redis:
        condition: service_healthy

    networks:
      - laravel


  # ==========================================================
  # Queue Worker
  # ==========================================================
  queue:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: laravel_queue_mpp

    restart: unless-stopped

    working_dir: /app

    volumes:
      - .:/app

    command:
      - php
      - artisan
      - queue:work
      - redis
      - --sleep=1
      - --tries=3
      - --timeout=120

    environment:
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: "3306"
      DB_DATABASE: ${DB_DATABASE:-laravel}
      DB_USERNAME: ${DB_USERNAME:-laravel}
      DB_PASSWORD: ${DB_PASSWORD:-secret}
      REDIS_CLIENT: predis
      REDIS_HOST: redis
      REDIS_PORT: "6379"

    depends_on:
      mysql:
        condition: service_healthy

      redis:
        condition: service_healthy

    healthcheck:
      test: ["NONE"]

    networks:
      - laravel


  # ==========================================================
  # Scheduler
  # ==========================================================
  scheduler:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: laravel_scheduler_mpp

    restart: unless-stopped

    working_dir: /app

    volumes:
      - .:/app

    command:
      - php
      - artisan
      - schedule:work

    environment:
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: "3306"
      DB_DATABASE: ${DB_DATABASE:-laravel}
      DB_USERNAME: ${DB_USERNAME:-laravel}
      DB_PASSWORD: ${DB_PASSWORD:-secret}
      REDIS_CLIENT: predis
      REDIS_HOST: redis
      REDIS_PORT: "6379"

    depends_on:
      mysql:
        condition: service_healthy

      redis:
        condition: service_healthy

    healthcheck:
      test: ["NONE"]

    networks:
      - laravel

  # ==========================================================
  # MySQL
  # ==========================================================
  mysql:
    image: mysql:8.4

    container_name: laravel_mysql_mpp

    restart: unless-stopped

    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-laravel}
      MYSQL_USER: laravel
      MYSQL_PASSWORD: ${DB_PASSWORD:-secret}
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-secret}

    volumes:
      - mysql_data:/var/lib/mysql

    ports:
      - "3306:3306"

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "mysqladmin ping -h 127.0.0.1 -u root --password=$${MYSQL_ROOT_PASSWORD} || exit 1"
        ]

      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s

    networks:
      - laravel


  # ==========================================================
  # Redis
  # ==========================================================
  redis:
    image: redis:7-alpine

    container_name: laravel_redis_mpp

    restart: unless-stopped

    command:
      - redis-server
      - --appendonly
      - yes

    volumes:
      - redis_data:/data

    ports:
      - "6379:6379"

    healthcheck:
      test:
        [
          "CMD",
          "redis-cli",
          "ping"
        ]

      interval: 5s
      timeout: 5s
      retries: 10

    networks:
      - laravel

  # ==========================================================
  # Vite
  # ==========================================================
  vite:
    image: node:22-alpine

    container_name: laravel_vite_mpp

    restart: unless-stopped

    working_dir: /app

    volumes:
      - .:/app
      - node_modules:/app/node_modules

    environment:
      - CHOKIDAR_USEPOLLING=true

    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"

    ports:
      - "5173:5173"

    depends_on:
      app:
        condition: service_started

    networks:
      - laravel

# ============================================================
# Volumes
# ============================================================

volumes:

  mysql_data:

  redis_data:

  node_modules:


# ============================================================
# Network
# ============================================================

networks:

  laravel:
    driver: bridge
