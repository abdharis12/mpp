version: 3

project:
    name: 'Website MPP dan Absensi Tenant Kabupaten Muara Enim'
    description: 'Government document and data storage platform'
    domain: 'government-web-app'
    audience: 'government staff'
    language: 'id'

design_intent:
    style:
        primary: 'claymorphism'
        secondary: 'none'

    brand:
        primary: '#123C86'
        secondary: '#FEC62C'
        accent: '#FAF9F6'

    personality:
        - professional
        - modern
        - distinctive

    creativity:
        level: 'moderate'
        allow_asymmetry: true
        allow_visual_risk: true
        signature_element: true

    density:
        desktop: 'comfortable'
        tablet: 'comfortable'
        mobile: 'compact'

    theme:
        mode: 'light'

    accessibility:
        target: 'AA'
        reduced_motion: true

    motion:
        preference: 'subtle'

    content:
        tone: 'professional'
        factual_claims_only: true

design_system:
    status: 'unresolved'
    resolver_version: '3'
    source: 'design_intent'

    typography: {}
    spacing: {}
    radius: {}
    elevation: {}
    surfaces: {}
    borders: {}
    motion: {}
    semantic_colors: {}

    component_adaptation:
        status: 'pending'

        foundation:
            - 'shadcn'
            - 'radix'

        strategy: 'modify-existing-first'

        components: {}

components:
    strategy: 'reuse-existing'

    reuse_existing: true
    preserve_api: true
    preserve_behavior: true

    foundation:
        source:
            - 'shadcn'
            - 'radix'

        adaptation:
            enabled: true
            strategy: 'modify-existing-first'

    rules:
        create_duplicate_for_visual_style: false
        create_style_named_components: false
        preserve_accessibility: true
        preserve_component_api: true

governance:
    resolve_design_system_before_major_ui: true

    adapt_existing_components_first: true
    preserve_foundation_behavior: true
    preserve_component_api: true

    no_duplicate_foundation_components: true

    no_page_local_design_system: true

    brand_colors_are_authoritative: true

    style_controls_treatment: true
    brand_controls_identity: true

    run_ui_auditor_after_ui_changes: true

resolver:
    engine: 'deterministic-ai-v3'
    policy: 'fixed-resolution-order'

    last_resolved_at: null
    needs_review_reason: null

component_registry:
    strategy: 'adapt-existing-first'

    foundation:
        - 'shadcn'
        - 'radix'

    ledger: {}

validation:
    schema: 'templates/ui-system.schema.json'
    validator: 'scripts/validate-ui-system.py'
